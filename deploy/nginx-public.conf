location = /airspace { return 301 /airspace/; }
location ^~ /airspace/ {
    # This optional include is generated from Cloudflare's published IP ranges.
    include /etc/nginx/snippets/airspace-cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    proxy_pass https://app.getsupers.com;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name app.getsupers.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host app.getsupers.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 65s;
    client_max_body_size 128k;
}
